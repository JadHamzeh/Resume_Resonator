
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR SAM Choir</title>
</head>
<body>
  <h1>OCR SAM Choir</h1>

  <button id="enable">Enable Audio</button>

  <p id="status">Loading choir.js...</p>

  <p>Detected: <span id="detected">—</span></p>
  <p>Notes: <span id="notes">—</span></p>
  <p>Lyrics: <span id="lyrics">—</span></p>

  <script type="module">
    const status = document.getElementById('status');

    let choir;
    let lastId = -1;
    let latest = null;
    let audioEnabled = false;

    try {
      choir = await import('./choir.js');
      status.textContent = 'Ready. Click Enable Audio.';
    } catch (error) {
      status.textContent =
        'Cannot load choir.js: ' + error.message;
      console.error(error);
    }

    async function run(action) {
      try {
        if (!choir) {
          throw new Error('choir.js did not load.');
        }

        await action();
      } catch (error) {
        status.textContent = 'ERROR: ' + error.message;
        console.error(error);
      }
    }

    async function sing(notes, lyrics) {
      if (!audioEnabled) {
        status.textContent = 'Click Enable Audio first.';
        return;
      }

      const voices = await choir.singSamChoir(
        notes,
        [...(lyrics || 'LA')]
      );

      status.textContent =
        `Scheduled ${voices} voice(s): ${lyrics || 'LA'}`;
    }

    // Enable Audio button
    document.getElementById('enable').onclick = () =>
      run(async () => {
        const enabled = await choir.unlockAudio();

        if (!enabled) {
          throw new Error('Audio could not be enabled.');
        }

        audioEnabled = true;
        status.textContent = 'Audio enabled! Ready to scan.';

        document.getElementById('enable').disabled = true;
        document.getElementById('enable').textContent =
          'Audio Enabled';
      });

    // Automatically check for new scans
    async function poll() {
      try {
        const response = await fetch('/latest', {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        latest = data;

        if (data.id !== lastId) {
          const isNew = lastId !== -1;
          lastId = data.id;

          document.getElementById('detected').textContent =
            data.text || '(empty)';

          document.getElementById('notes').textContent =
            (data.notes || []).join(', ') || '(none)';

          document.getElementById('lyrics').textContent =
            data.lyrics || '(none)';

          // Automatically sing when new text is scanned
          if (
            isNew &&
            data.notes?.length &&
            audioEnabled
          ) {
            await run(() => sing(data.notes, data.lyrics));
          }
        }
      } catch (error) {
        status.textContent =
          'Python server error: ' + error.message;
      }
    }

    setInterval(poll, 500);
    poll();
  </script>
</body>
</html>
